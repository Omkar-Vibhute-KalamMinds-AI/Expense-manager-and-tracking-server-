[project]
name = "expense-manager-server"
version = "0.1.0"
description = "Personal expense manager and tracker server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.115.0",
    "fastmcp==4.1.0",
    "fastmcp-slim[client,server]==4.1.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["remote_expense_manager_server"]
